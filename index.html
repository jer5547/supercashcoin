<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPER CASH COIN</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0014;
      color: #ffe600;
      font-family: "Press Start 2P", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 2px,
        transparent 2px,
        transparent 4px
      );
      z-index: 5;
    }

    .screen {
      position: relative;
      text-align: center;
      padding: 24px;
      z-index: 1;
    }

    .coin {
      width: 120px;
      height: 120px;
      margin: 0 auto 36px;
      border-radius: 50%;
      border: 6px solid #ffe600;
      box-shadow: 0 0 12px #ffe600, 0 0 28px #ff2bd6, inset 0 0 18px #ff2bd6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #39ff14;
      text-shadow: 0 0 8px #39ff14;
      animation: spin 4s linear infinite;
    }

    h1 {
      font-size: clamp(18px, 4vw, 36px);
      line-height: 1.6;
      color: #39ff14;
      text-shadow:
        0 0 6px #39ff14,
        0 0 18px #39ff14,
        4px 4px 0 #ff2bd6;
      margin-bottom: 28px;
    }

    .soon {
      font-size: clamp(14px, 3vw, 22px);
      color: #ffe600;
      text-shadow: 0 0 8px #ffe600, 0 0 20px #ff2bd6;
      animation: blink 1s steps(1) infinite;
    }

    .insert {
      margin-top: 48px;
      font-size: 12px;
      color: #ff2bd6;
      text-shadow: 0 0 8px #ff2bd6;
      letter-spacing: 2px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }

    @keyframes spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="screen">
    <div class="coin">$</div>
    <h1>SUPER CASH<br />COIN</h1>
    <p class="soon">COMING SOON</p>
    <p class="insert">INSERT COIN</p>
  </div>
</body>
</html>
